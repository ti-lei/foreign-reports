<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>券商行程日曆</title>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales/zh-tw.global.min.js"></script>
<style>
  body { font-family: -apple-system, "Noto Sans TC", system-ui, sans-serif; margin:0; padding:4px; background:#fff; color:#1f2937; }
  .bar { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; padding:4px 2px 12px; font-size:13px; color:#6b7280; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin:0 3px 0 10px; vertical-align:middle; }

  /* 搜尋小介面 */
  .search-wrap { position:relative; flex:1 1 220px; min-width:170px; }
  #search { width:100%; box-sizing:border-box; padding:7px 11px; font-size:14px; border:1px solid #d1d5db; border-radius:8px; outline:none; }
  #search:focus { border-color:#2563eb; box-shadow:0 0 0 2px rgba(37,99,235,.15); }
  .results { position:absolute; z-index:40; left:0; right:0; top:100%; margin-top:4px; background:#fff; border:1px solid #e5e7eb; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.14); max-height:330px; overflow-y:auto; -webkit-overflow-scrolling:touch; display:none; }
  .results.show { display:block; }
  .result { padding:8px 11px; border-bottom:1px solid #f3f4f6; cursor:pointer; }
  .result:last-child { border-bottom:none; }
  .result:hover, .result.active { background:#f3f6fb; }
  .result .r-main { color:#111827; font-weight:600; font-size:13px; }
  .result .r-sub { color:#6b7280; font-size:12px; margin-top:2px; }
  .result.empty { color:#9ca3af; cursor:default; font-size:13px; }

  .fc-event { cursor:pointer; }

  /* 月曆「+N more」彈出清單：單日事件太多時限高可捲，避免超出畫面 */
  .fc-popover { max-width:calc(100vw - 16px); }
  .fc-popover .fc-popover-body { max-height:min(65vh, 440px); overflow-y:auto; -webkit-overflow-scrolling:touch; }

  /* 明細彈窗：絕對定位，置中於「目前可視區域」由 JS 計算（iframe 內也準） */
  .modal { display:none; position:absolute; top:0; left:0; width:100%; background:rgba(0,0,0,.45); z-index:10000; }
  .card { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); box-sizing:border-box;
          background:#fff; border-radius:12px; padding:18px 20px; width:calc(100% - 32px); max-width:380px;
          max-height:85vh; overflow-y:auto; -webkit-overflow-scrolling:touch; box-shadow:0 12px 44px rgba(0,0,0,.28); }
  .card .close { position:absolute; top:8px; right:12px; border:none; background:none; font-size:22px; cursor:pointer; color:#6b7280; }
  .row { display:flex; gap:10px; padding:6px 0; border-bottom:1px solid #f1f1f1; font-size:14px; }
  .row:last-child { border-bottom:none; }
  .row .k { width:48px; color:#6b7280; flex:none; }
  .row .v { color:#111827; word-break:break-all; }
  .gcal { display:block; margin-top:14px; text-align:center; padding:10px 12px; background:#1a73e8; color:#fff;
          border-radius:8px; text-decoration:none; font-size:14px; font-weight:600; }
  .gcal:hover { background:#1666d0; }

  /* 新增按鈕 */
  .add-btn { flex:none; border:none; background:#7c3aed; color:#fff; border-radius:8px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer; }
  .add-btn:active { background:#6d28d9; }

  /* 新增表單 */
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; margin-top:6px; }
  .form-grid .full { grid-column:1 / -1; }
  .fld label { display:block; font-size:12px; color:#6b7280; margin-bottom:3px; }
  .fld input, .fld select { width:100%; box-sizing:border-box; padding:7px 9px; font-size:14px; border:1px solid #d1d5db; border-radius:7px; outline:none; }
  .fld input:focus, .fld select:focus { border-color:#7c3aed; box-shadow:0 0 0 2px rgba(124,58,237,.15); }
  .form-actions { display:flex; gap:10px; margin-top:16px; }
  .btn-primary { flex:1; border:none; background:#7c3aed; color:#fff; border-radius:8px; padding:11px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-primary:disabled { opacity:.5; }
  .btn-ghost { flex:none; border:1px solid #d1d5db; background:#fff; color:#374151; border-radius:8px; padding:11px 16px; font-size:15px; cursor:pointer; }
  .card h2 { margin:0 4px 10px 0; font-size:17px; }
  .form-err { color:#dc2626; font-size:13px; margin-top:8px; min-height:1em; }

  /* 自建標籤 + 刪除鈕（明細彈窗內） */
  .self-badge { display:inline-block; background:#ede9fe; color:#6d28d9; font-size:12px; font-weight:600; padding:2px 9px; border-radius:6px; margin-bottom:8px; }
  .del-btn { display:block; width:100%; margin-top:12px; border:1px solid #ef4444; background:#fff; color:#ef4444; border-radius:8px; padding:10px; font-size:14px; font-weight:600; cursor:pointer; }
  .del-btn:active { background:#fef2f2; }

  @media (max-width: 600px) {
    .fc .fc-toolbar.fc-header-toolbar { flex-direction:column; gap:8px; align-items:stretch; }
    .fc .fc-toolbar-title { font-size:1.05em; text-align:center; }
    .form-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="bar">
  <span id="count">載入中…</span>
  <span><span class="dot" style="background:#2563eb"></span>線上<span class="dot" style="background:#16a34a"></span>實體<span class="dot" style="background:#6b7280"></span>其他<span class="dot" style="background:#7c3aed"></span>自建</span>
  <span class="search-wrap">
    <input id="search" type="search" placeholder="搜尋公司／代號／券商／主題／地點…" autocomplete="off">
    <div id="results" class="results"></div>
  </span>
  <button id="add-btn" class="add-btn" type="button">＋ 新增行程</button>
</div>
<div id="calendar"></div>

<div id="detail" class="modal" onclick="closeDetail()">
  <div class="card" onclick="event.stopPropagation()">
    <button class="close" onclick="closeDetail()">&times;</button>
    <div id="detail-body"></div>
    <a id="gcal-btn" class="gcal" href="#" target="_blank" rel="noopener">＋ 加入 Google 日曆</a>
    <button id="detail-admin-del" class="del-btn" style="display:none" type="button">刪除此行程（管理員）</button>
    <button id="detail-del" class="del-btn" style="display:none" type="button">刪除此行程</button>
  </div>
</div>

<div id="addModal" class="modal" onclick="closeAdd()">
  <div class="card" onclick="event.stopPropagation()">
    <button class="close" onclick="closeAdd()">&times;</button>
    <h2>新增行程</h2>
    <div class="form-grid">
      <div class="fld"><label>日期 *</label><input id="f-date" type="date"></div>
      <div class="fld"><label>時間</label><input id="f-time" type="time"></div>
      <div class="fld"><label>公司</label><input id="f-company" type="text" placeholder="公司名稱"></div>
      <div class="fld"><label>代號</label><input id="f-ticker" type="text" placeholder="如 2330"></div>
      <div class="fld"><label>券商</label><input id="f-broker" type="text"></div>
      <div class="fld"><label>形式</label><select id="f-type"><option value="">—</option><option>線上會議</option><option>實體會議</option><option>法說會</option></select></div>
      <div class="fld full"><label>主題（無公司時填）</label><input id="f-topic" type="text" placeholder="如 總經策略會"></div>
      <div class="fld full"><label>地點</label><input id="f-location" type="text"></div>
      <div class="fld full"><label>報名連結</label><input id="f-signup" type="url" placeholder="https://"></div>
    </div>
    <div id="f-err" class="form-err"></div>
    <div class="form-actions">
      <button id="f-submit" class="btn-primary" type="button">儲存</button>
      <button class="btn-ghost" type="button" onclick="closeAdd()">取消</button>
    </div>
  </div>
</div>

<script>
var CAL = null;
var ALL = [];   // 有日期的行程（供搜尋與跳轉）
var MY_EMAIL = null;   // 目前 Cloudflare Access 登入者；只有本人能刪自己新增的行程
var IS_ADMIN = false;  // 管理者可在彈窗刪除任何行程（真正關卡在後端 /api/admin/delete）
fetch('/api/whoami').then(function(r){ return r.json(); }).then(function(j){ MY_EMAIL = j.email || null; IS_ADMIN = !!j.isAdmin; }).catch(function(){});

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nameOf(it){ return it.company ? it.company + (it.ticker ? ' (' + it.ticker + ')' : '') : (it.topic || it.broker || '行程'); }

// 由一筆行程資料組出 FullCalendar 事件物件（新增/初始化共用）。
function eventOf(it){
  var timed = it.event_time && it.event_time.indexOf(':') > 0 && it.event_time.length <= 5;
  var start = it.event_date;
  if (timed) start = it.event_date + 'T' + (it.event_time.length === 4 ? '0' + it.event_time : it.event_time) + ':00';
  var mt = it.meeting_type || '';
  // 自建行程一律紫色；其餘依形式：線上藍 / 實體綠 / 其他灰
  var color = it.source === 'manual' ? '#7c3aed'
            : (mt.indexOf('線上') >= 0 ? '#2563eb' : (mt.indexOf('實體') >= 0 ? '#16a34a' : '#6b7280'));
  return { id: String(it.id), title: nameOf(it), start: start, allDay: !timed, color: color, extendedProps: it };
}

document.addEventListener('DOMContentLoaded', function(){
  fetch('/api/itineraries').then(function(r){ return r.json(); }).then(function(data){
    var list = data.itineraries || [];
    document.getElementById('count').textContent = '共 ' + (data.count || list.length) + ' 筆';
    ALL = list.filter(function(it){ return it.event_date; });
    var events = ALL.map(eventOf);
    var isMobile = window.matchMedia('(max-width: 767px)').matches;
    CAL = new FullCalendar.Calendar(document.getElementById('calendar'), {
      initialView: isMobile ? 'listMonth' : 'dayGridMonth',
      locale: 'zh-tw',
      height: 'auto',
      firstDay: 1,
      headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,listMonth' },
      buttonText: { today: '今天', month: '月曆', list: '清單' },
      dayMaxEvents: 3,
      events: events,
      eventClick: function(info){ showDetail(info.event.extendedProps); info.jsEvent.preventDefault(); }
    });
    CAL.render();
  }).catch(function(e){ document.getElementById('count').textContent = '載入失敗: ' + e.message; });
});

/* ---- 搜尋 ---- */
var searchBox = document.getElementById('search');
var resultsBox = document.getElementById('results');
searchBox.addEventListener('input', function(){ runSearch(this.value); });
searchBox.addEventListener('focus', function(){ if (this.value.trim()) runSearch(this.value); });
document.addEventListener('click', function(e){
  if (!e.target.closest('.search-wrap')) resultsBox.classList.remove('show');
});

function runSearch(q){
  q = q.trim().toLowerCase();
  if (!q){ resultsBox.classList.remove('show'); resultsBox.innerHTML = ''; return; }
  var hits = ALL.filter(function(it){
    return [it.company, it.ticker, it.broker, it.topic, it.location, it.meeting_type].some(function(f){
      return f && String(f).toLowerCase().indexOf(q) >= 0;
    });
  });
  hits.sort(function(a,b){ return (a.event_date+'' ).localeCompare(b.event_date+''); });
  hits = hits.slice(0, 40);
  if (!hits.length){
    resultsBox.innerHTML = '<div class="result empty">找不到符合的行程</div>';
    resultsBox.classList.add('show'); return;
  }
  resultsBox.innerHTML = hits.map(function(it){
    var sub = [it.event_date + (it.event_time ? ' ' + it.event_time : ''), it.broker, it.meeting_type].filter(Boolean).join('  ·  ');
    return '<div class="result" data-id="' + it.id + '"><div class="r-main">' + esc(nameOf(it)) + '</div><div class="r-sub">' + esc(sub) + '</div></div>';
  }).join('');
  resultsBox.classList.add('show');
}
resultsBox.addEventListener('click', function(e){
  var el = e.target.closest('.result'); if (!el || !el.dataset.id) return;
  var it = ALL.filter(function(x){ return String(x.id) === el.dataset.id; })[0];
  if (!it) return;
  resultsBox.classList.remove('show');
  if (CAL && it.event_date) CAL.gotoDate(it.event_date);
  showDetail(it);
});

/* ---- 明細彈窗（置中於可視區域，iframe 內也準） ---- */
// 把彈窗卡片置中在「使用者目前看得到的區域」中心。
// 重點：iframe 內 position:absolute 是相對「內容座標」，所以中心要 = 內容捲動量
// window.scrollY（iframe 自己捲動）＋ 可視區在 iframe 視窗內的中心。
// 可視區用 frameElement（同源）算：兼顧「外層頁面捲動」與「iframe 內部捲動」兩種情況。
var OPEN_MODAL = null;   // 目前開啟的彈窗 id（'detail' 或 'addModal'）
function positionCard(){
  if (!OPEN_MODAL) return;
  var modal = document.getElementById(OPEN_MODAL);
  if (!modal || modal.style.display !== 'block') return;
  var card = modal.querySelector('.card');
  modal.style.height = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) + 'px';
  var S = window.scrollY || window.pageYOffset || 0;
  var centerY, visH;
  try {
    var fe = window.frameElement;
    if (fe) {
      var rect = fe.getBoundingClientRect();           // iframe 在父視窗的位置
      var pvh = window.parent.innerHeight || window.innerHeight;
      var vTop = Math.max(0, -rect.top);                // 可視區起點（iframe 視窗座標）
      var vBot = Math.min(fe.clientHeight, pvh - rect.top); // 可視區終點
      centerY = S + (vTop + vBot) / 2;                  // ＋內容捲動量 → 內容座標
      visH = vBot - vTop;
    } else {
      centerY = S + window.innerHeight / 2;
      visH = window.innerHeight;
    }
  } catch (err) {
    centerY = S + window.innerHeight / 2;
    visH = window.innerHeight;
  }
  card.style.top = Math.round(centerY) + 'px';
  card.style.maxHeight = Math.max(220, Math.round(visH - 28)) + 'px';
}

// 開/關彈窗的共用邏輯：設 OPEN_MODAL、置中、掛/解捲動監聽。
function openModal(id){
  OPEN_MODAL = id;
  document.getElementById(id).style.display = 'block';
  positionCard();
  window.addEventListener('scroll', positionCard, { passive: true });
  window.addEventListener('resize', positionCard);
  try { window.parent.addEventListener('scroll', positionCard, { passive: true }); } catch (e) {}
}
function closeModal(id){
  document.getElementById(id).style.display = 'none';
  if (OPEN_MODAL === id) OPEN_MODAL = null;
  window.removeEventListener('scroll', positionCard);
  window.removeEventListener('resize', positionCard);
  try { window.parent.removeEventListener('scroll', positionCard); } catch (e) {}
}
function closeDetail(){ closeModal('detail'); }
function closeAdd(){ closeModal('addModal'); }

/* ---- 「加入 Google 日曆」連結（範本 URL，免 API／免授權，開新增活動頁讓使用者按儲存）---- */
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function gcalDates(p){
  if (!p.event_date) return null;
  var d = String(p.event_date).replace(/-/g, '');          // YYYYMMDD
  var t = p.event_time;
  var timed = t && t.indexOf(':') > 0 && t.length <= 5;
  if (timed){
    var hh = (t.length === 4 ? '0' + t : t);                // HH:MM
    var sh = parseInt(hh.slice(0,2), 10), sm = hh.slice(3,5);
    var eh = sh + 1, em = sm;
    if (eh >= 24){ eh = 23; em = '59'; }                    // 邊界：23 點起，結束設當日 23:59
    return d + 'T' + pad2(sh) + sm + '00/' + d + 'T' + pad2(eh) + em + '00';
  }
  var dt = new Date(p.event_date + 'T00:00:00');            // 全天：結束日＝隔天（Google end 為排除）
  dt.setDate(dt.getDate() + 1);
  var nd = dt.getFullYear() + pad2(dt.getMonth()+1) + pad2(dt.getDate());
  return d + '/' + nd;
}
function buildGCalUrl(p){
  var dates = gcalDates(p);
  if (!dates) return null;
  var head = p.company ? (p.company + (p.ticker ? '(' + p.ticker + ')' : '')) : (p.topic || '券商行程');
  var title = head + (p.meeting_type ? ' ' + p.meeting_type : '') + (p.broker ? ' · ' + p.broker : '');
  var det = [];
  if (p.broker) det.push('券商：' + p.broker);
  if (p.meeting_type) det.push('形式：' + p.meeting_type);
  if (p.topic && p.company) det.push('主題：' + p.topic);
  if (p.signup_url) det.push('報名：' + p.signup_url);
  det.push('—— 來自券商行程日曆');
  var u = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent(title)
        + '&dates=' + dates
        + '&ctz=Asia/Taipei'
        + '&details=' + encodeURIComponent(det.join('\n'));
  if (p.location) u += '&location=' + encodeURIComponent(p.location);
  return u;
}

function showDetail(p){
  p = p || {};
  var rows = [['日期',p.event_date],['時間',p.event_time],['券商',p.broker],['公司',p.company],['代號',p.ticker],['主題',p.topic],['形式',p.meeting_type],['地點',p.location],['報名',p.signup_url]];
  if (p.source === 'manual' && p.created_by) rows.push(['新增者', p.created_by]);
  var html = (p.source === 'manual') ? '<div class="self-badge">自建行程</div>' : '';
  for (var i=0;i<rows.length;i++){
    var v = rows[i][1];
    if (v === null || v === undefined || v === '') continue;
    v = (rows[i][0] === '報名') ? '<a href="' + esc(v) + '" target="_blank" rel="noopener">' + esc(v) + '</a>' : esc(v);
    html += '<div class="row"><span class="k">' + rows[i][0] + '</span><span class="v">' + v + '</span></div>';
  }
  document.getElementById('detail-body').innerHTML = html;
  var btn = document.getElementById('gcal-btn');
  var gurl = buildGCalUrl(p);
  if (gurl){ btn.href = gurl; btn.style.display = 'block'; } else { btn.style.display = 'none'; }
  // 管理員刪除鈕：admin 對「任何行程」都顯示（可刪券商/別人/自己的）。
  var adel = document.getElementById('detail-admin-del');
  if (IS_ADMIN){ adel.style.display = 'block'; adel.onclick = function(){ adminDel(p); }; }
  else { adel.style.display = 'none'; adel.onclick = null; }
  // 擁有者刪除鈕：只有自建行程、且本人新增（created_by 為空的舊資料放行）才顯示。
  // admin 時隱藏（上面的管理員鈕已涵蓋，避免兩顆）。
  var del = document.getElementById('detail-del');
  var canDelete = !IS_ADMIN && p.source === 'manual' && (!p.created_by || p.created_by === MY_EMAIL);
  if (canDelete){ del.style.display = 'block'; del.onclick = function(){ delSelf(p); }; }
  else { del.style.display = 'none'; del.onclick = null; }
  openModal('detail');
}

/* ---- 新增行程 ---- */
document.getElementById('add-btn').addEventListener('click', function(){
  document.getElementById('f-err').textContent = '';
  openModal('addModal');
});

function fval(id){ var v = document.getElementById(id).value; return v && v.trim() ? v.trim() : null; }

document.getElementById('f-submit').addEventListener('click', function(){
  var btn = this;
  var err = document.getElementById('f-err');
  var payload = {
    event_date: fval('f-date'), event_time: fval('f-time'),
    broker: fval('f-broker'), company: fval('f-company'), ticker: fval('f-ticker'),
    meeting_type: fval('f-type'), topic: fval('f-topic'),
    location: fval('f-location'), signup_url: fval('f-signup')
  };
  if (!payload.event_date){ err.textContent = '請填日期'; return; }
  if (!payload.company && !payload.topic){ err.textContent = '請至少填公司或主題'; return; }
  btn.disabled = true; err.textContent = '';
  fetch('/api/itinerary/add', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      btn.disabled = false;
      if (!j.ok){ err.textContent = j.error || '新增失敗'; return; }
      var it = j.itinerary || payload; it.id = j.id;
      ALL.push(it);
      if (CAL){ CAL.addEvent(eventOf(it)); CAL.gotoDate(it.event_date); }
      document.getElementById('count').textContent = '共 ' + ALL.length + ' 筆';
      ['f-date','f-time','f-broker','f-company','f-ticker','f-type','f-topic','f-location','f-signup'].forEach(function(id){ document.getElementById(id).value=''; });
      closeAdd();
    })
    .catch(function(e){ btn.disabled = false; err.textContent = '錯誤：' + e.message; });
});

/* ---- 刪除自建行程（擁有者）---- */
function delSelf(p){
  if (!confirm('確定刪除這筆自建行程？')) return;
  doDelete('/api/itinerary/delete', p);
}
/* ---- 管理員刪除任何行程 ---- */
function adminDel(p){
  if (!confirm('（管理員）確定刪除這筆行程？\n' + (p.company || p.topic || '') + ' ' + (p.event_date || ''))) return;
  doDelete('/api/admin/delete', p);
}
function doDelete(endpoint, p){
  fetch(endpoint, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ id: p.id }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.ok){ alert('刪除失敗：' + (j.error || '')); return; }
      ALL = ALL.filter(function(x){ return String(x.id) !== String(p.id); });
      if (CAL){ var ev = CAL.getEventById(String(p.id)); if (ev) ev.remove(); }
      document.getElementById('count').textContent = '共 ' + ALL.length + ' 筆';
      closeDetail();
    })
    .catch(function(e){ alert('錯誤：' + e.message); });
}
</script>
</body>
</html>
